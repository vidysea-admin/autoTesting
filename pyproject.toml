  "stages/run_artifacts.py:_assemble_case:glob | U3d",
  "stages/schedule_store.py:_purge_locked:mkdir | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_purge_locked:os.rename | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_purge_locked:os.replace | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_purge_locked:shutil.rmtree | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_purge_locked:unlink | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_purge_locked:write_text | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
