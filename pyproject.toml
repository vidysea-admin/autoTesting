[project]
name = "autotester"
version = "0.1.0"
description = "AI automated end-to-end tester: video/docs to best/worst/edge evals, run in a real browser"
readme = "README.md"
authors = [
    { name = "umesh", email = "umeshsugara@vidysea.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "browser-use==0.5.9",  # T-177 AF6: MIT, fallback actuator (D-041); exact pin + telemetry off (D-075)
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.0",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langgraph==1.2.14",  # T-167/D-041: release-regression graph (checkpointer + interrupt)
    "google-genai>=2.22.0",  # AT-130/AT-268: providers/gemini.py and gemini_files.py
    # import this directly; it was only a transitive dep
    # of langchain-google-genai, undeclared for the one
    # package this repo's headline recall number depends on.
    "openpyxl>=3.1.5",
    "pypdf>=6.20.1,<7",  # bounded host-side PDF teaching extraction
    "Pillow>=11,<13",  # local screenshot sanitation; no external image service
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.9.0",
    "pyyaml==6.0.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "starlette>=1.6.0",  # AT-130 regression test: ui/routes_crawls.py, routes_issues.py and
    # routes_report.py import `starlette.background.BackgroundTask`
    # directly; it was only a transitive dep of fastapi/uvicorn -- the
    # same undeclared-direct-import hazard the new doctor check catches.
    "typer>=0.27.2",
    "uvicorn[standard]>=0.30.0",
    "argon2-cffi==25.1.0",  # T-204 password hashing, authorized by D-072 "new modules / auth"
    "litellm==1.104.0",  # T-202 (D-071): providers/litellm_provider.py; exact pin, SDK only
    "mcp>=2.3,<3",  # T-174 (D-071): mcp_server.py, local stdio MCP adapter
    "deepagents>=0.7.24,<0.8",
    "langchain>=1.4.5",
    "langchain-ollama>=1.0",
]

[project.scripts]
autotester = "autotester:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/autotester/cli.py" = ["B008"]  # typer.Option defaults are the framework idiom
"src/autotester/cli_issues.py" = ["B008"]  # same idiom, same reason

[tool.mypy]
python_version = "3.11"
files = ["src/autotester"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.autotester.store]
database = "autotester"  # D-121/D-122: the ONLY database the store may write; required, no default

[tool.autotester.doctor.state-bypass]
# mongo-store M16 (qa/contracts/mongo-store.md). check_state_bypass fails a raw filesystem call on a
# state path. `baseline` = known remaining sites, each tagged with the unit that removes it. A row is
# `path:enclosing function:kind` (not a line number, so an unrelated edit does not move it); a repeated
# row allows that many sites. A row that matches no call is itself an error, so the list only shrinks.
# `permanent` = never state.
baseline = [
  "core/image_privacy.py:_sanitize_one:is_file | U5b (M24/M51): image bytes belong to the BlobStore",
  "core/paths.py:ProjectPaths.ensure:mkdir | U9: directory creation moves with the hosting module (M49)",
  "core/paths.py:work_dir:mkdir | U9: directory creation moves with the hosting module (M49)",
  "media/redacted.py:RedactedFrames.__init__:unlink | U5b (M24/M51): redaction scratch and derivative media bytes",
  "media/redacted.py:redact_video:mkdir | U5b (M24/M51): redaction scratch and derivative media bytes",
  "media/redacted.py:redact_video:unlink | U5b (M24/M51): redaction scratch and derivative media bytes",
  "media/redacted.py:review_scratch:shutil.rmtree | U5b (M24/M51): redaction scratch and derivative media bytes",
  "media/redacted.py:review_scratch:shutil.rmtree | U5b (M24/M51): redaction scratch and derivative media bytes",
  "media/redacted.py:verify_blackout:unlink | U5b (M24/M51): redaction scratch and derivative media bytes",
  "sources/adapters.py:_sanitize_pdf_reading:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "sources/adapters.py:_sanitize_pdf_reading:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "sources/drive_register.py:_write_bytes:read_bytes | U5b (M24/M51): media bytes are a BlobStore write, not a path write",
  "sources/email_register.py:_write_attachment_to_disk:read_bytes | U5b (M24/M51): media bytes are a BlobStore write, not a path write",
  "stages/explore_consent.py:signing_key_available:is_file | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "stages/explore_consent.py:signing_key_available:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "stages/leak_evidence.py:store_masked_screenshot:read_bytes | U5b (M24/M51): screenshot bytes read back for the masked copy",
  "stages/ux_advisory.py:_screenshots:is_file | U5b (M24/M51): media read via materialize",
  "stages/video_access.py:media_path:is_file | U5b (M24/M51): media read via materialize",
  "ui/app.py:_guard_intake:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/app.py:_guard_intake:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_credentials.py:env_editor_view:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_credentials.py:env_editor_view:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_product_map.py:learned_frame:is_file | U5b (M24/M51): media read via materialize",
  "ui/routes_role_accounts.py:_commit:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_commit:read_bytes | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_env_now:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_env_now:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_restore:unlink | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_restore:unlink | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_role_accounts.py:_restore:write_bytes | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_settings.py:_present_keys:exists | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_settings.py:_present_keys:read_text | U11 (M35): .env presence/read; credentials stay out of the store (redaction)",
  "ui/routes_video.py:_safe_video_path:is_file | U5b (M24/M51): media read via materialize",
]
permanent = [
  "core/env.py:_device:exists | host filesystem probe (st_dev walk), not state",
  "core/env.py:_device:stat | host filesystem probe (st_dev), not state",
  "core/env.py:dollar_value_keys:exists | repo-root .env presence check; U11 owns credential moves",
  "core/env.py:load_repo_env:exists | repo-root .env presence check; U11 owns credential moves",
  "core/env.py:mongo_uri:is_file | repo-root .env presence check (the store URI bootstrap cannot read itself from the store); U11 owns credential moves",
  "core/env.py:storage_warning:read_text | host mount table probe, not state",
  "core/image_privacy.py:_find_tesseract:is_file | host tool probe (tesseract binary), not state",
  "ledger/citations.py:_decision_subjects:is_file | reads committed docs and ledger sources, not run state",
  "ledger/citations.py:_decision_subjects:read_text | reads committed docs and ledger sources, not run state",
  "ledger/citations.py:_scan:read_text | reads committed docs and ledger sources, not run state",
  "ledger/citations.py:_scan_file:read_text | reads committed docs and ledger sources, not run state",
  "ledger/citations.py:appended_ids:read_text | reads committed docs and ledger sources, not run state",
  "providers/vision_probe.py:_validated_bytes:is_file | static probe image shipped in the repo, not state",
  "providers/vision_probe.py:_validated_bytes:read_bytes | static probe image shipped in the repo, not state",
  "providers/vision_probe.py:_validated_bytes:stat | static probe image shipped in the repo, not state",
  "stages/acceptance_baseline.py:_input_bytes:read_bytes | caller-supplied input folder outside the data root, not state",
  "stages/adversarial.py:load_probe_sets:is_file | committed prompt files (RepoDocs.prompts_dir), not state",
  "stages/adversarial.py:load_probe_sets:read_text | committed prompt files (RepoDocs.prompts_dir), not state",
  "stages/discover.py:_candidates:is_dir | discovery walks caller-approved host trees read-only, not state",
  "stages/discover.py:_candidates:iterdir | discovery walks caller-approved host trees read-only, not state",
  "stages/discover.py:approved_roots:is_dir | discovery walks caller-approved host trees read-only, not state",
  "stages/discover.py:bounded_files:stat | discovery walks caller-approved host trees read-only, not state",
  "stages/real_acceptance.py:write_evidence:mkdir | checked-in evidence under qa/evidence/t169-real/, not run state (M49)",
  "stages/real_acceptance.py:write_evidence:write_text | checked-in evidence under qa/evidence/t169-real/, not run state (M49)",
  "ui/intake_upload.py:handle_upload:shutil.rmtree | upload staging scratch, not state",
  "ui/routes_bench_inputs.py:upload_atomic_list:read_bytes | upload staging scratch, not state",
  "ui/routes_bench_inputs.py:upload_atomic_list:shutil.rmtree | upload staging scratch, not state",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
