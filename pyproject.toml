]
permanent = [
  "core/env.py:98:exists | repo-root .env presence check; U11 owns credential moves",
  "core/env.py:119:exists | host filesystem probe (st_dev walk), not state",
  "core/env.py:121:stat | host filesystem probe (st_dev), not state",
  "core/env.py:197:exists | repo-root .env presence check; U11 owns credential moves",
