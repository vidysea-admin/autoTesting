permanent = [
  "core/env.py:_device:exists | host filesystem probe (st_dev walk), not state",
  "core/env.py:_device:stat | host filesystem probe (st_dev), not state",
  "core/env.py:dollar_value_keys:exists | repo-root .env presence check; U11 owns credential moves",
