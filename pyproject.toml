  "stages/generic_acceptance.py:_press_run:exists | U3d",
  "stages/generic_acceptance.py:_press_run:iterdir | U3d",
  "stages/generic_acceptance.py:_press_run:iterdir | U3d",
  "stages/orchestrate_checkpoint.py:FileCheckpointer._digest:exists | U7: moves with the raw checkpoint read and put_if (M20); the public path API has neither",
  "stages/orchestrate_checkpoint.py:FileCheckpointer._load:exists | U7: moves with the raw checkpoint read and put_if (M20); the public path API has neither",
  "stages/orchestrate_downstream.py:_generation_reentry:exists | U3d",
  "stages/orchestrate_downstream.py:make_expand_stage.run:exists | U3d",
