  "stages/schedule_store.py:claim:os.open | U7: needs a create_exclusive-by-path (M19); the public path API has none and store/filestore.py is at its 300-line cap",
  "stages/source_material.py:_reading_bytes:exists | U3d",
  "stages/source_material.py:_reading_bytes:exists | U3d",
  "stages/unified_report.py:_saw_network:exists | U3d",
  "stages/unified_report.py:load_api:exists | U3d",
  "stages/unified_report_findings.py:load_run_findings:glob | U3d",
