  "delivery/inbox.py:122:iterdir | U3c-deferred, needs list_children (U4)",
  "sources/adapters.py:143:exists | U3a",
  "sources/drive_register.py:193:exists | U3a",
  "sources/drive_register.py:196:write_bytes | U3a",
  "sources/email_register.py:215:exists | U3a",
  "sources/email_register.py:218:write_bytes | U3a",
