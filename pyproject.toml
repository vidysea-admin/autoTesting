  "stages/schedule_store.py:_restore_stage:shutil.rmtree | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
  "stages/schedule_store.py:_restore_stage:shutil.rmtree | U7: purge as delete_many (contract U7 row); rename/rmtree staging has no public path API",
