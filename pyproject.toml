[project]
name = "autotester"
version = "0.1.0"
description = "AI automated end-to-end tester: video/docs to best/worst/edge evals, run in a real browser"
readme = "README.md"
authors = [
    { name = "umesh", email = "umeshsugara@vidysea.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "browser-use==0.5.9",  # T-177 AF6: MIT, fallback actuator (D-041); exact pin + telemetry off (D-075)
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.0",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langgraph==1.2.14",  # T-167/D-041: release-regression graph (checkpointer + interrupt)
    "google-genai>=2.22.0",  # AT-130/AT-268: providers/gemini.py and gemini_files.py
    # import this directly; it was only a transitive dep
    # of langchain-google-genai, undeclared for the one
    # package this repo's headline recall number depends on.
    "openpyxl>=3.1.5",
    "pypdf>=6.20.1,<7",  # bounded host-side PDF teaching extraction
    "Pillow>=11,<13",  # local screenshot sanitation; no external image service
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.9.0",
    "pyyaml==6.0.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "starlette>=1.6.0",  # AT-130 regression test: ui/routes_crawls.py, routes_issues.py and
    # routes_report.py import `starlette.background.BackgroundTask`
    # directly; it was only a transitive dep of fastapi/uvicorn -- the
    # same undeclared-direct-import hazard the new doctor check catches.
    "typer>=0.27.2",
    "uvicorn[standard]>=0.30.0",
    "argon2-cffi==25.1.0",  # T-204 password hashing, authorized by D-072 "new modules / auth"
    "litellm==1.104.0",  # T-202 (D-071): providers/litellm_provider.py; exact pin, SDK only
    "mcp>=2.3,<3",  # T-174 (D-071): mcp_server.py, local stdio MCP adapter
    "deepagents>=0.7.24,<0.8",
    "langchain>=1.4.5",
    "langchain-ollama>=1.0",
]

[project.scripts]
autotester = "autotester:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/autotester/cli.py" = ["B008"]  # typer.Option defaults are the framework idiom
"src/autotester/cli_issues.py" = ["B008"]  # same idiom, same reason

[tool.mypy]
python_version = "3.11"
files = ["src/autotester"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.autotester.store]
database = "autotester"  # D-121/D-122: the ONLY database the store may write; required, no default

[tool.autotester.doctor.state-bypass]
# mongo-store M16 (qa/contracts/mongo-store.md). check_state_bypass fails a raw filesystem call on a
# state path. `baseline` = known remaining sites, each tagged with the unit that removes it. A row is
# `path:enclosing function:kind` (not a line number, so an unrelated edit does not move it); a repeated
# row allows that many sites. A row that matches no call is itself an error, so the list only shrinks.
# `permanent` = never state.
baseline = [
  "core/image_privacy.py:_sanitize_one:stat | UNOWNED (no unit row covers this file)",
  "core/paths.py:ProjectPaths.ensure:mkdir | UNOWNED (no unit row covers this file)",
  "core/paths.py:work_dir:mkdir | UNOWNED (no unit row covers this file)",
  "delivery/inbox.py:_create_once:mkdir | U7: needs a create_exclusive-by-path (M19); the public path API has none and store/filestore.py is at its 300-line cap",
  "delivery/inbox.py:_create_once:os.link | U7: needs a create_exclusive-by-path (M19); the public path API has none and store/filestore.py is at its 300-line cap",
  "delivery/inbox.py:_create_once:unlink | U7: needs a create_exclusive-by-path (M19); the public path API has none and store/filestore.py is at its 300-line cap",
  "delivery/inbox.py:_create_once:write_text | U7: needs a create_exclusive-by-path (M19); the public path API has none and store/filestore.py is at its 300-line cap",
  "providers/config_migration.py:_payload:exists | UNOWNED (no unit row covers this file)",
  "providers/config_migration.py:_payload:exists | UNOWNED (no unit row covers this file)",
  "providers/vision_probe.py:_validated_bytes:stat | UNOWNED (no unit row covers this file)",
  "sources/adapters.py:_sanitize_pdf_reading:exists | U3d",
  "sources/drive_intake.py:_Intake.one_video:shutil.rmtree | U3d",
  "sources/drive_intake.py:_Intake.one_zip:shutil.rmtree | U3d",
  "sources/drive_intake.py:_sweep_stale:shutil.rmtree | U3d",
  "sources/drive_intake.py:_sweep_stale:stat | U3d",
  "sources/drive_register.py:_write_bytes:exists | U3d",
  "sources/drive_register.py:_write_bytes:mkdir | U3d",
  "sources/drive_register.py:_write_bytes:write_bytes | U3d",
  "sources/email_register.py:_write_attachment_to_disk:exists | U3d",
  "sources/email_register.py:_write_attachment_to_disk:mkdir | U3d",
  "sources/email_register.py:_write_attachment_to_disk:write_bytes | U3d",
  "sources/intake_commit.py:_copy_in:os.replace | U3d",
  "sources/intake_commit.py:_copy_in:unlink | U3d",
  "sources/intake_commit.py:_lock_is_stale:stat | U3d",
  "sources/intake_commit.py:_place:mkdir | U3d",
  "sources/intake_commit.py:_place:os.replace | U3d",
  "sources/intake_commit.py:commit_video:exists | U3d",
  "sources/intake_commit.py:commit_video:rmdir | U3d",
  "sources/intake_commit.py:commit_video:unlink | U3d",
