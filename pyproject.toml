  "sources/intake_commit.py:intake_lock:os.open | U3d",
  "sources/intake_commit.py:intake_lock:os.utime | U3d",
  "sources/intake_commit.py:intake_lock:unlink | U3d",
  "sources/intake_commit.py:intake_lock:unlink | U3d",
  "sources/intake_commit.py:intake_session:mkdir | U3d",
  "sources/intake_commit.py:intake_session:shutil.rmtree | U3d",
  "sources/intake_commit.py:sweep_orphans:glob | U3d",
  "sources/intake_commit.py:sweep_orphans:glob | U3d",
  "sources/intake_commit.py:sweep_orphans:iterdir | U3d",
